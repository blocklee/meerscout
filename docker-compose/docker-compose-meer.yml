version: '3.9'

services:
  redis-db:
    extends:
      file: ./services/redis.yml
      service: redis-db

  db-init:
    extends:
      file: ./services/db.yml
      service: db-init

  db:
    depends_on:
      db-init:
        condition: service_completed_successfully
    extends:
      file: ./services/db.yml
      service: db

  backend:
    depends_on:
      - db
      - redis-db
    extends:
      file: ./services/meer.yml
      service: backend
    # 加这一行，绝不拉取，只用本地
    pull_policy: never
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
      args:
        RELEASE_VERSION: 7.0.2
    links:
      - db:database
    environment:
        ETHEREUM_JSONRPC_HTTP_URL: http://172.17.0.1:18545/
        ETHEREUM_JSONRPC_TRACE_URL: http://172.17.0.1:18545/
        ETHEREUM_JSONRPC_WS_URL: ws://172.17.0.1:18546/
        MICROSERVICE_ACCOUNT_ABSTRACTION_ENABLED: true
        CHAIN_ID: '813'
        EXCHANGE_RATES_MARKET_CAP_SOURCE: 'coin_market_cap'
        EXCHANGE_RATES_PRICE_SOURCE: 'coin_market_cap' 
        EXCHANGE_RATES_COINMARKETCAP_API_KEY: 'b082eb60-9ca2-43a8-817e-5df872cbba64'
        EXCHANGE_RATES_COINMARKETCAP_COIN_ID: '15658'

  nft_media_handler:
    depends_on:
      - backend
    extends:
      file: ./services/nft_media_handler.yml
      service: nft_media_handler
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
      args:
        RELEASE_VERSION: 7.0.2

  visualizer:
    extends:
      file: ./services/visualizer.yml
      service: visualizer

  sig-provider:
    extends:
      file: ./services/sig-provider.yml
      service: sig-provider

  frontend:
    depends_on:
      - backend
    extends:
      file: ./services/frontend.yml
      service: frontend
    # 覆盖远程镜像, 使用本地自建镜像 # pull_policy覆盖 always，避免去 Docker Hub 拉不存在的 tag
    # 确保指向正确的主网环境文件common-frontend-meer-mainnet.env
    image: blockscout-frontend:meer-v138 
    pull_policy: missing 
    env_file:
      - ./envs/common-frontend-meer-mainnet.env  

  stats-db-init:
    extends:
      file: ./services/stats.yml
      service: stats-db-init

  stats-db:
    depends_on:
      stats-db-init:
        condition: service_completed_successfully
    extends:
      file: ./services/stats.yml
      service: stats-db

  stats:
    depends_on:
      - stats-db
      - backend
    extends:
      file: ./services/stats.yml
      service: stats

  user-ops-indexer:
    depends_on:
      - db
      - backend
    extends:
      file: ./services/user-ops-indexer.yml
      service: user-ops-indexer

  proxy:
    depends_on:
      - backend
      - frontend
      - stats
    extends:
      file: ./services/nginx.yml
      service: proxy
